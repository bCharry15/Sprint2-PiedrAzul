spring.application.name=piedraazul-agenda-service
server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3306/piedraazul
spring.datasource.username=appuser
spring.datasource.password=123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

spring.application.name=piedraazul-agenda-service
server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3306/piedraazul
spring.datasource.username=appuser
spring.datasource.password=123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=co.edu.unicauca.piedraazul.agenda.controller
springdoc.paths-to-match=/api/**

agenda.service.url=${AGENDA_SERVICE_URL:http://localhost:8081}